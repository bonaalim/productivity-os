<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#0f1117"/>

  <!-- center(256,256) -->
  <!-- outer dots r=230: -->
  <!-- top(256,26) tr(418,94) r(486,256) br(418,418) b(256,486) bl(94,418) l(26,256) tl(94,94) -->
  <!-- inner endpoints r=90 (line stops at outer ring): -->
  <!-- top(256,166) tr(320,192) r(346,256) br(320,320) b(256,346) bl(192,320) l(166,256) tl(192,192) -->
  <!-- rings r=90,60,30 gap=30 -->

  <!-- spokes -->
  <line x1="256" y1="26"  x2="256" y2="166" stroke="#4f8ef7" stroke-width="14" stroke-linecap="round"/>
  <line x1="418" y1="94"  x2="320" y2="192" stroke="#7c5cfc" stroke-width="14" stroke-linecap="round"/>
  <line x1="486" y1="256" x2="346" y2="256" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round"/>
  <line x1="418" y1="418" x2="320" y2="320" stroke="#f59e42" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="486" x2="256" y2="346" stroke="#e05c7a" stroke-width="14" stroke-linecap="round"/>
  <line x1="94"  y1="418" x2="192" y2="320" stroke="#a3e635" stroke-width="14" stroke-linecap="round"/>
  <line x1="26"  y1="256" x2="166" y2="256" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
  <line x1="94"  y1="94"  x2="192" y2="192" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>

  <!-- outer dots -->
  <circle cx="256" cy="26"  r="16" fill="#4f8ef7"/>
  <circle cx="418" cy="94"  r="16" fill="#7c5cfc"/>
  <circle cx="486" cy="256" r="16" fill="#2dd4bf"/>
  <circle cx="418" cy="418" r="16" fill="#f59e42"/>
  <circle cx="256" cy="486" r="16" fill="#e05c7a"/>
  <circle cx="94"  cy="418" r="16" fill="#a3e635"/>
  <circle cx="26"  cy="256" r="16" fill="#fb923c"/>
  <circle cx="94"  cy="94"  r="16" fill="#38bdf8"/>

  <!-- concentric rings: outer thin → inner thick, all opaque -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#3a3f4a" stroke-width="4"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#6b7280" stroke-width="8"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#c0c4cc" stroke-width="13"/>

  <!-- center dot -->
  <circle cx="256" cy="256" r="17" fill="#ffffff"/>
</svg>
